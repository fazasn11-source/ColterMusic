buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Use a compatible Android Gradle Plugin version. Adjust if your project needs a different one.
        classpath 'com.android.tools.build:gradle:7.4.2'
        // Add the Kotlin Gradle plugin so "apply plugin: 'kotlin-android'" in app module can be resolved
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
