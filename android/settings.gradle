pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Add the Flutter Gradle plugin so "dev.flutter.flutter-gradle-plugin" can be resolved.
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
        // Kotlin Gradle plugin declaration for pluginManagement (keeps compatibility if plugins {} is used)
        id "org.jetbrains.kotlin.android" version "1.8.22" apply false
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "colter_music"
include ":app"
